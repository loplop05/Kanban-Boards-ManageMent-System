<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - NeoBoard</title>
  
  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            },
            dark: {
              950: '#090d16',
              900: '#0f172a',
              800: '#1e293b',
              700: '#334155',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #090d16 75%);
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="text-slate-200 min-h-screen flex items-center justify-center p-4 page">

  <div class="w-full max-w-md">
    
    <!-- Brand Logo header -->
    <div class="flex flex-col items-center mb-8">
      <div class="w-12 h-12 rounded-xl bg-brand-600 flex items-center justify-center text-white font-bold shadow-xl shadow-brand-500/20 mb-3">
        <i data-lucide="layout-dashboard" class="w-6 h-6"></i>
      </div>
      <h1 class="text-2xl font-extrabold tracking-wider text-white">NEO<span class="text-brand-500">BOARD</span></h1>
      <p class="text-xs text-slate-400 mt-1.5">Collaborative Kanban Management System</p>
    </div>

    <!-- Login Box -->
    <div class="glass-panel rounded-2xl p-8 shadow-2xl">
      <h2 class="text-xl font-bold text-white mb-1.5 text-center">Welcome Back</h2>
      <p class="text-xs text-slate-400 text-center mb-6">Enter your credentials to access your workspaces</p>

      <form class="login-form space-y-4">
        
        <!-- Username input -->
        <div class="space-y-1.5">
          <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">Username</label>
          <div class="relative">
            <i data-lucide="user" class="w-4 h-4 text-slate-500 absolute left-3 top-1/2 -translate-y-1/2"></i>
            <input id="username" type="text" placeholder="e.g. ammar" required class="w-full bg-dark-950/50 border border-dark-700/50 focus:border-brand-500 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none transition-all">
          </div>
        </div>

        <!-- Password input -->
        <div class="space-y-1.5">
          <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">Password</label>
          <div class="relative">
            <i data-lucide="lock" class="w-4 h-4 text-slate-500 absolute left-3 top-1/2 -translate-y-1/2"></i>
            <input id="password" type="password" placeholder="••••••••" required class="w-full bg-dark-950/50 border border-dark-700/50 focus:border-brand-500 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none transition-all">
          </div>
        </div>

        <!-- Error Msg -->
        <p id="msg" class="text-xs text-rose-400 font-semibold text-center mt-2"></p>

        <!-- Submit Button -->
        <button type="submit" class="w-full py-3 rounded-xl bg-brand-600 hover:bg-brand-500 text-white font-semibold text-sm shadow-lg shadow-brand-500/20 transition-all flex items-center justify-center gap-2 mt-6">
          <span>Sign In</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>

      </form>

      <!-- Testing Help Info -->
      <div class="mt-8 pt-6 border-t border-dark-700/30 text-center">
        <span class="text-[10px] font-bold text-slate-500 uppercase tracking-wider block mb-2.5">Demo Credentials</span>
        <div class="grid grid-cols-2 gap-2 text-[10px] text-slate-400 font-mono">
          <div class="bg-white/5 rounded-lg py-1.5 px-2.5 border border-white/5">
            <span class="text-slate-500 block">Admin</span>
            <span>admin / admin</span>
          </div>
          <div class="bg-white/5 rounded-lg py-1.5 px-2.5 border border-white/5">
            <span class="text-slate-500 block">User</span>
            <span>ammar / 1234</span>
          </div>
        </div>
      </div>

    </div>

  </div>

  <script src="/js/users.js"></script>
  <script src="/js/login.js"></script>
  <script>
    // Initialize Lucide Icons
    lucide.createIcons();
  </script>
</body>
</html>
