<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/admin-dashboard.css">
</head>
<body class="page">

<div class="topbar">
  <div class="brand">NeoBoard (Admin)</div>
  <button id="logoutBtn" class="btn">Logout</button>
</div>

<div class="wrap">
  <div class="card">
    <h1 id="welcomeMsg">Welcome</h1>
    <p class="muted" id="loginInfo">Login time:</p>
  </div>

  <div class="grid">
    <div class="card">
      <h2>Users List</h2>
      
      <ul id="usersList" class="list">
        
      </ul>
    </div>

    <div class="card">
      <h2>Boards Permissions</h2>
      <p class="muted">Choose allowed users + actions per board (saved).</p>

      <label class="muted">Select Board:</label>
      <select id="boardSelect" class="select"></select>

      <div class="miniCard">
        <h3 class="muted">Allowed Users</h3>
        <div id="allowedUsersBox"></div>
      </div>

      <div class="miniCard">
        <h3 class="muted">Permissions</h3>
        <label><input type="checkbox" id="pAddCard"> Add Card</label><br>
        <label><input type="checkbox" id="pAddList"> Add List</label><br>
        <label><input type="checkbox" id="pMoveCard"> Move Card</label><br>
        <label><input type="checkbox" id="pDeleteCard"> Delete Card</label>
      </div>

      <button id="saveBtn" class="btn btn-primary">Save</button>
    </div>
  </div>
</div>

<script src="/js/users.js"></script>
<script src="/js/admin-dashboard.js"></script>
</body>
</html>
