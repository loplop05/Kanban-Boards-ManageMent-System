<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Contact — Kanban</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>

<body>


  <!--Header -->
  <header class="site-header">
    <div class="header-inner">
      <div class="logo">KANABN</div>
      <nav class="main-nav" aria-label="main list">
        <a href="#" class="nav-link">Home</a>
        <!-- active class marks current page in the nav -->
        <a href="index.html" class="nav-link active">About Us</a>
        <a href="services.html" class="nav-link">Services</a>
        <a href="portfolio.html" class="nav-link">Projects</a>
        <a href="contact.html" class="nav-link">Contact Us</a>
        <a href="/app/login-page.html" class = "nav-link">Lets Start !</a>
      </nav>
    </div>
  </header>

  <main class="container">

    <section class="hero">
      <h1>Contact Us</h1>
      <p class="hero-sub">We would happy to hear your questions or suggestions.</p>
    </section>

    <section class="contact-wrapper">

      <!-- Contact Info -->
      <div class="contact-info">
        <h3>Contact Information</h3>
        <p>📧 Email: info@kanban.com</p>
        <p>📞 Phone: +962 7XXXXXXXX</p>
        <p>📍 Location: Jordan</p>
      </div>

      <!-- Contact Form -->
      <form class="contact-form">
        <div class="form-group">
          <label>Name</label>
          <input type="text" placeholder="Your full name" maxlength="50" required>
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" placeholder="example@email.com" required>
        </div>

        <div class="form-group">
          <label>Subject</label>
          <input type="text" maxlength="100" placeholder="Massage subject">
        </div>

        <div class="form-group">
          <label>Massage</label>
          <textarea rows="5" placeholder="Write your Massage here ..." maxlength="250" required></textarea>
        </div>

        <button type="submit" class="btn">send</button>
      </form>

    </section>

  </main>
  <!--Footer-->
  <footer class="site-footer" role="contentinfo">
    <div class="container">
      <p>Contact: email@example.com | Phone: +962 7XXXXXXXX</p>
      <p>© 2025 Kanban Project</p>
    </div>
  </footer>


</body>

</html>
